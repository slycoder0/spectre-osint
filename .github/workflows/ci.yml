name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip check
        run: pip check
      - name: Tests
        run: pytest --cov=spectre_osint --cov-branch --cov-report=term-missing
      - name: Ruff
        run: ruff check spectre_osint tests
      - name: mypy
        run: mypy spectre_osint
      - name: pip-audit
        run: pip-audit
      - name: Freeze lock
        run: pip freeze > requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-py${{ matrix.python-version }}
          path: requirements.lock
