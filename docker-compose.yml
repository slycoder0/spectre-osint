services:
  spectre:
    build: .
    image: spectre-osint:0.1.0-alpha
    env_file:
      - path: .env
        required: false
    environment:
      SPECTRE_DATA_DIR: /app/data
      SPECTRE_REPORTS_DIR: /app/reports
      SPECTRE_LOGS_DIR: /app/logs
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - spectre-data:/app/data
      - spectre-reports:/app/reports
      - spectre-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # CLI-first: the image entrypoint is `spectre`, so pass a command at run time,
    # e.g. `docker compose run --rm spectre username alice_osint`.
    user: "1000:1000"
    read_only: false

volumes:
  spectre-data:
  spectre-reports:
  spectre-logs:
