# Passive username catalog. HTTP 200 is never sufficient for CONFIRMED.
# check_method: json_api | generic_html | login_wall
sites:
  - name: GitHub
    category: Development
    profile_url: "https://github.com/{username}"
    check_url: "https://api.github.com/users/{username}"
    check_method: json_api
    json_id_field: login
    display_name_fields: [name, login]
    website_fields: [blog]
    bio_field: bio
    avatar_field: avatar_url
    location_field: location
    expected_status: [200]
    not_found_status: [404]
    enabled: true
    confidence_strategy: explicit_api
    rate_limit: 0.5
    notes: Public users API. Token optional for quota.

  - name: GitLab
    category: Development
    profile_url: "https://gitlab.com/{username}"
    check_url: "https://gitlab.com/{username}"
    check_method: generic_html
    success_patterns: ["p-name", "user-profile"]
    not_found_patterns: ["sign in or sign up", "page not found"]
    expected_status: [200]
    not_found_status: [404]
    enabled: true
    confidence_strategy: multi_signal
    rate_limit: 0.4

