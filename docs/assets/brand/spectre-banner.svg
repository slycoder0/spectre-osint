<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Radial Ambient Glows -->
  <circle cx="600" cy="160" r="220" fill="url(#glowGrad)" />
  <circle cx="1020" cy="80" r="140" fill="url(#glowGrad)" />
  <circle cx="180" cy="240" r="140" fill="url(#glowGrad)" />

  <!-- Subtle Graph Network Pattern (Right Side) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1">
    <line x1="880" y1="80" x2="980" y2="60" />
    <line x1="980" y1="60" x2="1080" y2="110" />
    <line x1="980" y1="60" x2="1030" y2="170" />
    <line x1="1080" y1="110" x2="1140" y2="90" />
    <line x1="1080" y1="110" x2="1110" y2="210" />
    <line x1="1030" y1="170" x2="1110" y2="210" />
    <line x1="1030" y1="170" x2="950" y2="230" />
    <line x1="950" y1="230" x2="1010" y2="270" />
    <line x1="1010" y1="270" x2="1110" y2="210" />
    <line x1="880" y1="80" x2="920" y2="160" />
    <line x1="920" y1="160" x2="950" y2="230" />
  </g>
  <g opacity="0.6">
    <circle cx="880" cy="80" r="3" fill="#00f5ff" />
    <circle cx="980" cy="60" r="4.5" fill="#38bdf8" />
    <circle cx="1080" cy="110" r="4" fill="#818cf8" />
    <circle cx="1140" cy="90" r="2.5" fill="#38bdf8" />
    <circle cx="1030" cy="170" r="5" fill="#00f5ff" />
    <circle cx="1110" cy="210" r="3.5" fill="#c084fc" />
    <circle cx="950" cy="230" r="4" fill="#38bdf8" />
    <circle cx="1010" cy="270" r="3" fill="#818cf8" />
    <circle cx="920" cy="160" r="3" fill="#00f5ff" />
  </g>

  <!-- Geometric Emblem / Icon (Left Side) -->
  <g transform="translate(100, 75)">
    <!-- Outer Hexagon Ring -->
    <polygon points="85,5 160,48 160,135 85,178 10,135 10,48" fill="none" stroke="#1e293b" stroke-width="2" />
    <polygon points="85,15 150,53 150,130 85,168 20,130 20,53" fill="#0b1329" fill-opacity="0.8" stroke="url(#cyanGrad)" stroke-width="1.8" filter="url(#softGlow)" />

    <!-- Inner Nodes & Constellation -->
    <line x1="85" y1="35" x2="130" y2="75" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="85" y1="35" x2="40" y2="75" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="40" y1="75" x2="55" y2="135" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="130" y1="75" x2="115" y2="135" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="55" y1="135" x2="85" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="115" y1="135" x2="85" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="85" y1="35" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />
    <line x1="40" y1="75" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />
    <line x1="130" y1="75" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />
    <line x1="55" y1="135" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />
    <line x1="115" y1="135" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />
    <line x1="85" y1="150" x2="85" y2="95" stroke="#00f5ff" stroke-width="2" />

    <!-- Center Core -->
    <circle cx="85" cy="95" r="9" fill="#00f5ff" filter="url(#glow)" />
    <circle cx="85" cy="95" r="4.5" fill="#ffffff" />

    <!-- Perimeter Nodes -->
    <circle cx="85" cy="35" r="4" fill="#38bdf8" />
    <circle cx="130" cy="75" r="4" fill="#818cf8" />
    <circle cx="40" cy="75" r="4" fill="#818cf8" />
    <circle cx="55" cy="135" r="4" fill="#38bdf8" />
    <circle cx="115" cy="135" r="4" fill="#38bdf8" />
    <circle cx="85" cy="150" r="4" fill="#c084fc" />
  </g>

  <!-- Typography -->
  <!-- SPECTRE Title -->
  <text x="320" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="8" fill="url(#cyanGrad)" filter="url(#softGlow)">SPECTRE</text>

  <!-- OSINT Tag Badge -->
  <g transform="translate(730, 95)">
    <rect width="115" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="57" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#00f5ff" text-anchor="middle">OSINT</text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="325" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#94a3b8">WORKSTATION DE INTELIGÊNCIA PÚBLICA</text>

  <!-- Invariant Accent Line -->
  <text x="325" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.5" fill="#38bdf8" opacity="0.9">
    PASSIVE-FIRST &#8226; PROVENIÊNCIA ESTRITA &#8226; IDENTIDADE NUNCA PRESUMIDA
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#cyanGrad)" />
</svg>
