site_name: SPECTRE OSINT
site_description: Workstation de inteligência pública, passiva e estruturada para investigação de pegadas digitais.
repo_name: slycoder0/spectre-osint
repo_url: https://github.com/slycoder0/spectre-osint
edit_uri: ""

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite

nav:
  - "Início": index.md
  - "Guia Rápido": getting-started.md
  - "Instalação": installation.md
  - "Comandos": commands.md
  - "Exemplos": examples.md
  - "Resultados & Status": results.md
  - "Configuração": configuration.md
  - "Resolução de Problemas": troubleshooting.md
  - "Conceitos":
      - "Modelo de Evidências": concepts/evidence.md
      - "Status de Verificação": concepts/statuses.md
      - "Privacidade & Segurança": concepts/privacy-and-safety.md
  - "Técnico":
      - "Arquitetura": technical/architecture.md
      - "Site Catalog 2.0": technical/site-catalog.md
      - "Engine de Usernames": technical/username-engine.md
      - "Enriquecimento": technical/enrichment.md
      - "Busca & Descoberta": technical/search-discovery.md
      - "Correlação de Identidades": technical/identity-correlation.md
      - "Authenticated Public": technical/authenticated-public.md
      - "Interface Web Legada": technical/legacy-web.md
      - "Testes & Qualidade": technical/testing.md
      - "Processo de Release": technical/release.md
  - "English Docs":
      - "Overview": en/index.md
      - "Quick Start": en/quick-start.md
      - "CLI Commands": en/commands.md
